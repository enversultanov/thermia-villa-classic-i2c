# Thermia Villa Classic (controller board 901 353) – reads the I2C service port with an ESP8266 (NodeMCU V3).
# See README.md and docs/register-map.md. USE ENTIRELY AT YOUR OWN RISK.
#
# Wiring via a level shifter (BSS138) or an I2C isolator (ISO1540): pump SCL -> D1 (GPIO5), pump SDA -> D2 (GPIO4), GND -> GND.
# The ESP must have its OWN power supply (USB charger) – NEVER power it from the pump's +5V pin.
# Read-only: the component never sends write commands to the pump.
#
# Flash (USB):     docker run --rm -v "$PWD/esphome":/config --device /dev/ttyUSB0 \
#                    ghcr.io/esphome/esphome:stable run thermia.yaml --device /dev/ttyUSB0
# Logs over WiFi:  docker run --rm --network host -v "$PWD/esphome":/config \
#                    ghcr.io/esphome/esphome:stable logs thermia.yaml --device thermia-i2c.local
esphome:
  name: thermia-i2c
  friendly_name: Heat pump

esp8266:
  board: nodemcuv2

external_components:
  - source:
      type: local
      path: components

logger:
  level: INFO   # DEBUG/VERBOSE logs every received frame
  baud_rate: 115200

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Thermia-I2C fallback"   # if WiFi can't be reached: connect here and pick a network

captive_portal:

thermia_i2c:
  id: tp
  address: 0x2E
  sda: 4   # D2
  scl: 5   # D1
  request_registers: false   # just listen. The Villa Classic 901 353 sends its registers by itself.

sensor:
  - platform: wifi_signal
    name: WiFi signal
    update_interval: 60s
  - platform: template
    name: I2C frames
    accuracy_decimals: 0
    state_class: total_increasing
    lambda: return id(tp).frames();
    update_interval: 30s
  - platform: template
    name: Registers seen
    accuracy_decimals: 0
    lambda: return id(tp).registers_seen();
    update_interval: 30s
  # Register map: docs/register-map.md (one pump, compared with its display – verify against YOUR display).
  # Sensor temperatures are encoded as value + 40 (so that -40 °C fits in one byte).
  - {platform: template, name: Outdoor temperature,    unit_of_measurement: "°C", device_class: temperature, state_class: measurement, accuracy_decimals: 0, update_interval: 30s, lambda: "float v = id(tp).value(0x30); return std::isnan(v) ? v : v - 40;"}
  - {platform: template, name: Room setpoint,          unit_of_measurement: "°C", device_class: temperature, state_class: measurement, accuracy_decimals: 0, update_interval: 30s, lambda: "return id(tp).value(0x00);"}
  - {platform: template, name: Heating curve,          state_class: measurement, accuracy_decimals: 0, update_interval: 30s, lambda: "return id(tp).value(0x03);"}
  # Supply/return/brine/supply setpoint: match the display, not yet change-tested.
  - {platform: template, name: Supply line,            unit_of_measurement: "°C", device_class: temperature, state_class: measurement, accuracy_decimals: 0, update_interval: 30s, lambda: "return id(tp).value(0x28);"}
  - {platform: template, name: Return line,            unit_of_measurement: "°C", device_class: temperature, state_class: measurement, accuracy_decimals: 0, update_interval: 30s, lambda: "return id(tp).value(0x29);"}
  - {platform: template, name: Brine out,              unit_of_measurement: "°C", device_class: temperature, state_class: measurement, accuracy_decimals: 0, update_interval: 30s, lambda: "float v = id(tp).value(0x2B); return std::isnan(v) ? v : v - 40;"}
  - {platform: template, name: Brine in,               unit_of_measurement: "°C", device_class: temperature, state_class: measurement, accuracy_decimals: 0, update_interval: 30s, lambda: "float v = id(tp).value(0x2D); return std::isnan(v) ? v : v - 40;"}
  - {platform: template, name: Supply line setpoint,   unit_of_measurement: "°C", device_class: temperature, state_class: measurement, accuracy_decimals: 0, update_interval: 30s, lambda: "return id(tp).value(0x32);"}
  - {platform: template, name: Integral setting, unit_of_measurement: "°min", state_class: measurement, entity_category: diagnostic, accuracy_decimals: 0, update_interval: 30s, lambda: "float v = id(tp).value(0x11); return std::isnan(v) ? v : (float) (int8_t) (uint8_t) v;"}
  # Probable (value equals the display, not change-tested):
  - {platform: template, name: Curve min,              unit_of_measurement: "°C", device_class: temperature, state_class: measurement, entity_category: diagnostic, accuracy_decimals: 0, update_interval: 30s, lambda: "return id(tp).value(0x06);"}
  - {platform: template, name: Curve max,              unit_of_measurement: "°C", device_class: temperature, state_class: measurement, entity_category: diagnostic, accuracy_decimals: 0, update_interval: 30s, lambda: "return id(tp).value(0x07);"}
  - {platform: template, name: Max return,             unit_of_measurement: "°C", device_class: temperature, state_class: measurement, entity_category: diagnostic, accuracy_decimals: 0, update_interval: 30s, lambda: "return id(tp).value(0x0B);"}
  - {platform: template, name: Sensor r2C (unknown),   unit_of_measurement: "°C", device_class: temperature, state_class: measurement, entity_category: diagnostic, accuracy_decimals: 0, update_interval: 30s, lambda: "float v = id(tp).value(0x2C); return std::isnan(v) ? v : v - 40;"}

binary_sensor:
  # The front panel LEDs, top to bottom.
  - platform: template
    name: Power supply          # the pump is sending frames = it has power
    device_class: power
    lambda: |-
      static uint32_t last = 0, t = 0;
      if (id(tp).frames() != last) { last = id(tp).frames(); t = millis(); }
      return last > 0 && millis() - t < 15000;
  - {platform: template, name: "Heat pump (compressor)", device_class: running, lambda: "if (!id(tp).has(0x33)) return {}; return id(tp).flag(0x33, 0x02);"}   # r33 bit1, confirmed: 12 starts overnight, house draws +1.5 kW while set
  - {platform: template, name: Hot water production, device_class: running, lambda: "if (!id(tp).has(0x33)) return {}; return id(tp).flag(0x33, 0x10);"}   # confirmed (7 hot water runs overnight, supply line 54–55 °C each time)
  - {platform: template, name: Circulation pump,     device_class: running, lambda: "if (!id(tp).has(0x33)) return {}; return id(tp).flag(0x33, 0x20);"}   # confirmed (off in the non-auto modes, on with its LED)
  - {platform: template, name: Auxiliary heater,     device_class: heat,    lambda: "return {};"}      # register not found yet -> unknown
  - {platform: template, name: Alarm,                device_class: problem, lambda: "return {};"}      # register not found yet -> unknown

button:
  - platform: restart
    name: Restart
    entity_category: config

text_sensor:
  - platform: template
    name: Operating mode   # r01, confirmed 2026-10-29 (1–4 changed on the display; 0 = off assumed)
    lambda: |-
      static const char *const m[] = {"Off","Auto","Hot water only","Heat pump only","Aux heater only"};
      if (!id(tp).has(0x01)) return {};
      int v = (int) id(tp).value(0x01);
      return v >= 0 && v <= 4 ? std::string(m[v]) : "? (" + to_string(v) + ")";
    update_interval: 15s
  - platform: template
    name: Register dump
    entity_category: diagnostic
    lambda: return id(tp).dump(0x00, 0x1F);
    update_interval: 15s
  - platform: template
    name: Register dump 2
    entity_category: diagnostic
    lambda: return id(tp).dump(0x20, 0x7F);
    update_interval: 15s
  - platform: wifi_info
    bssid:
      name: Connected access point (BSSID)
      entity_category: diagnostic
  - platform: template
    name: Last I2C frame
    entity_category: diagnostic
    lambda: return id(tp).last_frame();
    update_interval: 30s
