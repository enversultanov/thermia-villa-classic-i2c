# Thermia Villa Classic 55 – läser serviceporten (I2C) med NodeMCU V3 (ESP8266). Se README.md och docs/registerkarta.md.
# Koppling via nivåomvandlare (BSS138) eller I2C-isolator (ISO1540): pump SCL -> D1 (GPIO5), pump SDA -> D2 (GPIO4), GND -> GND.
# ESP:n ska ha EGEN strömförsörjning (USB-laddare) – mata den ALDRIG från pumpens +5V.
# Steg 1: bara läsning och loggning av rådata. Komponenten skickar aldrig skrivkommandon till pumpen.
#
# Programmera (USB):  docker run --rm -v "$PWD/esphome":/config --device /dev/ttyUSB0 \
#                       ghcr.io/esphome/esphome:stable run thermia.yaml --device /dev/ttyUSB0
# Logg via WiFi:      docker run --rm --network host -v "$PWD/esphome":/config \
#                       ghcr.io/esphome/esphome:stable logs thermia.yaml --device thermia-i2c.local
esphome:
  name: thermia-i2c
  friendly_name: Bergvärme

esp8266:
  board: nodemcuv2

external_components:
  - source:
      type: local
      path: components

logger:
  level: INFO
  baud_rate: 115200

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Thermia-I2C reserv"   # om WiFi inte går att nå: anslut hit och välj nät

captive_portal:

thermia_i2c:
  id: tp
  address: 0x2E
  sda: 4   # D2
  scl: 5   # D1
  request_registers: false   # steg 1: lyssna bara. Sätts till true om pumpen inte skickar något av sig själv.

sensor:
  - platform: wifi_signal
    name: WiFi-signal
    update_interval: 60s
  - platform: template
    name: I2C ramar
    accuracy_decimals: 0
    state_class: total_increasing
    lambda: return id(tp).frames();
    update_interval: 30s
  - platform: template
    name: Register sedda
    accuracy_decimals: 0
    lambda: return id(tp).registers_seen();
    update_interval: 30s
  # Registernummer enligt ThermIQ (data/thermia/thermiq_regs.py) – ska verifieras mot pumpens display.
  # Villa Classic 901353 (egen numrering, jämfört med displayen 2026-10-29): r00 rum börvärde (bekräftat), r03 kurva,
  # r28/r29 fram/retur (1–2 °C under displayen), r32 fram börvärde. Givartemperaturer kodade som värde + 40:
  # r30 ute (bekräftat 14 och 10 °C), r2D köldbärare fr/in, r2B köldbärare till/ut (en bild: 10/9). r16 = konstant 14, inte ute.
  - {platform: template, name: Utetemperatur,          unit_of_measurement: "°C", device_class: temperature, state_class: measurement, accuracy_decimals: 0, update_interval: 30s, lambda: "float v = id(tp).value(0x30); return std::isnan(v) ? v : v - 40;"}
  - {platform: template, name: Rum börvärde,           unit_of_measurement: "°C", device_class: temperature, state_class: measurement, accuracy_decimals: 0, update_interval: 30s, lambda: "return id(tp).value(0x00);"}
  - {platform: template, name: Kurva,                  state_class: measurement, accuracy_decimals: 0, update_interval: 30s, lambda: "return id(tp).value(0x03);"}
  # Fram/retur/köldbärare/fram börvärde: jämförda med displayen, ej ändringstestade.
  - {platform: template, name: Framledning,            unit_of_measurement: "°C", device_class: temperature, state_class: measurement, accuracy_decimals: 0, update_interval: 30s, lambda: "return id(tp).value(0x28);"}
  - {platform: template, name: Returledning,           unit_of_measurement: "°C", device_class: temperature, state_class: measurement, accuracy_decimals: 0, update_interval: 30s, lambda: "return id(tp).value(0x29);"}
  - {platform: template, name: Köldbärare ut,          unit_of_measurement: "°C", device_class: temperature, state_class: measurement, accuracy_decimals: 0, update_interval: 30s, lambda: "float v = id(tp).value(0x2B); return std::isnan(v) ? v : v - 40;"}
  - {platform: template, name: Köldbärare in,          unit_of_measurement: "°C", device_class: temperature, state_class: measurement, accuracy_decimals: 0, update_interval: 30s, lambda: "float v = id(tp).value(0x2D); return std::isnan(v) ? v : v - 40;"}
  - {platform: template, name: Framledning börvärde,   unit_of_measurement: "°C", device_class: temperature, state_class: measurement, accuracy_decimals: 0, update_interval: 30s, lambda: "return id(tp).value(0x32);"}
  - {platform: template, name: Integral, unit_of_measurement: "°min", state_class: measurement, accuracy_decimals: 0, update_interval: 30s, lambda: "float v = id(tp).value(0x11); return std::isnan(v) ? v : (float) (int8_t) (uint8_t) v;"}
  # Troliga (värde = display 2026-10-29, ej ändringstestade):
  - {platform: template, name: Kurva min, unit_of_measurement: "°C", device_class: temperature, state_class: measurement, entity_category: diagnostic, accuracy_decimals: 0, update_interval: 30s, lambda: "return id(tp).value(0x06);"}
  - {platform: template, name: Kurva max, unit_of_measurement: "°C", device_class: temperature, state_class: measurement, entity_category: diagnostic, accuracy_decimals: 0, update_interval: 30s, lambda: "return id(tp).value(0x07);"}
  - {platform: template, name: Max retur, unit_of_measurement: "°C", device_class: temperature, state_class: measurement, entity_category: diagnostic, accuracy_decimals: 0, update_interval: 30s, lambda: "return id(tp).value(0x0B);"}
  - {platform: template, name: Givare r2C (okänd), unit_of_measurement: "°C", device_class: temperature, state_class: measurement, entity_category: diagnostic, accuracy_decimals: 0, update_interval: 30s, lambda: "float v = id(tp).value(0x2C); return std::isnan(v) ? v : v - 40;"}

binary_sensor:
  # Panelens lampor uppifrån (etiketterna på pumpen). Villa Classic 901353 – se docs/registerkarta.md.
  - platform: template
    name: Spänningstillförsel   # pumpen skickar ramar = har ström
    device_class: power
    lambda: |-
      static uint32_t last = 0, t = 0;
      if (id(tp).frames() != last) { last = id(tp).frames(); t = millis(); }
      return last > 0 && millis() - t < 15000;
  - platform: template
    name: Värmepump             # beräknad: köldbärare fr − till >= 2 °C betyder att kompressorn tar värme ur borrhålet
    device_class: running
    lambda: |-
      if (!id(tp).has(0x2D) || !id(tp).has(0x2B)) return {};
      return id(tp).value(0x2D) - id(tp).value(0x2B) >= 2;
  - {platform: template, name: Varmvattenproduktion, device_class: running, lambda: "if (!id(tp).has(0x33)) return {}; return id(tp).flag(0x33, 0x10);"}   # trolig (fram 54 °C samtidigt)
  - {platform: template, name: Värmebärarpump,       device_class: running, lambda: "if (!id(tp).has(0x33)) return {}; return id(tp).flag(0x33, 0x20);"}   # trolig (alltid på, som lampan)
  - {platform: template, name: Tillsatsvärme,        device_class: heat,    lambda: "return {};"}      # register ej hittat än -> okänd
  - {platform: template, name: Larmindikering,       device_class: problem, lambda: "return {};"}      # register ej hittat än -> okänd

button:
  - platform: restart
    name: Starta om
    entity_category: config

text_sensor:
  - platform: template
    name: Registerdump
    entity_category: diagnostic
    lambda: return id(tp).dump(0x00, 0x1F);
    update_interval: 15s
  - platform: template
    name: Registerdump 2
    entity_category: diagnostic
    lambda: return id(tp).dump(0x20, 0x7F);
    update_interval: 15s
  - platform: wifi_info
    bssid:
      name: Ansluten åtkomstpunkt (BSSID)
      entity_category: diagnostic
  - platform: template
    name: Senaste I2C-ram
    entity_category: diagnostic
    lambda: return id(tp).last_frame();
    update_interval: 30s
